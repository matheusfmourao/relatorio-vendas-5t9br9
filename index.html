<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alfabetilar — origem das vendas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  /* Paleta extraida da propria pagina do Alfabetilar (04/10/2026).
     Verde-escuro #24382A, creme #F2EADB/#FBF5EA, dourado #DCA847/#C68F39,
     marrom #4A3524/#6B5A45. Tipografia: Cormorant Garamond + Lora. */
  :root {
    --verde:#24382a; --verde-esc:#1b2a20; --verde-claro:#4a5a38;
    --creme:#fbf5ea; --creme-md:#f2eadb; --creme-esc:#efede3;
    --ouro:#dca847; --ouro-esc:#c68f39;
    --marrom:#4a3524; --marrom-cl:#6b5a45;
    --papel:#fdf9ed; --borda:#e7e3d8;
  }
  * { box-sizing:border-box; }
  body { background:var(--creme-md); color:var(--marrom); margin:0;
    padding:28px 16px 40px;
    font:16px/1.6 Lora,Georgia,"Times New Roman",serif; }
  main { max-width:660px; margin:0 auto; background:var(--papel);
    border:1px solid var(--borda); border-radius:4px;
    box-shadow:0 1px 0 rgba(255,255,255,.7) inset, 3px 5px 0 0 var(--ouro),
      6px 10px 0 0 var(--ouro-esc), 0 14px 30px rgba(36,56,42,.16);
    padding:34px clamp(20px,4vw,42px) 30px; }
  .selo { font-family:Lora,Georgia,serif; font-size:11.5px; letter-spacing:.17em;
    text-transform:uppercase; color:var(--verde-claro); margin:0 0 10px; }
  h1 { font-family:"Cormorant Garamond",Georgia,serif; font-weight:600;
    font-size:clamp(30px,5.2vw,42px); line-height:1.08; color:var(--verde);
    margin:0 0 6px; letter-spacing:-.005em; }
  .ts { font-size:14px; font-style:italic; color:var(--marrom-cl); margin:0; }
  .orn { text-align:center; color:var(--ouro-esc); font-size:17px;
    margin:26px 0 22px; letter-spacing:.5em; }
  h2 { font-family:"Cormorant Garamond",Georgia,serif; font-weight:600;
    font-size:clamp(21px,3.2vw,26px); line-height:1.15; color:var(--verde);
    margin:30px 0 4px; }
  .nota { font-size:14.5px; line-height:1.6; color:var(--marrom-cl);
    margin:0 0 14px; }
  table { width:100%; border-collapse:collapse; font-size:15.5px; }
  th,td { padding:10px 10px; text-align:left;
    border-bottom:1px solid var(--borda); }
  thead th { background:var(--creme-md); font-family:Lora,Georgia,serif;
    font-size:11.5px; text-transform:uppercase; letter-spacing:.12em;
    color:var(--verde-claro); border-bottom:1px solid var(--ouro); }
  tbody tr:nth-child(even) td { background:rgba(242,234,219,.42); }
  .n { text-align:right; font-variant-numeric:tabular-nums; }
  tbody td:first-child { color:var(--verde); }
  tfoot td { font-weight:500; color:var(--verde); border-bottom:none;
    border-top:2px solid var(--verde); background:transparent; }
  .destaque { display:flex; gap:14px; margin:22px 0 2px; }
  .destaque > div { flex:1; background:var(--verde); color:var(--creme-md);
    border-radius:3px; padding:16px 18px;
    box-shadow:2px 3px 0 0 var(--ouro-esc); }
  .big { display:block; font-family:"Cormorant Garamond",Georgia,serif;
    font-weight:600; font-size:clamp(28px,4.4vw,36px); line-height:1.05;
    font-variant-numeric:tabular-nums; }
  .rot { display:block; font-size:11.5px; letter-spacing:.14em;
    text-transform:uppercase; color:rgba(242,234,219,.76); margin-top:5px; }
  .vazio { font-style:italic; color:var(--marrom-cl); margin:22px 0 0; }
  @media (max-width:430px) {
    .destaque { flex-direction:column; }
    main { box-shadow:0 1px 0 rgba(255,255,255,.7) inset,
      2px 3px 0 0 var(--ouro), 4px 6px 0 0 var(--ouro-esc),
      0 10px 22px rgba(36,56,42,.14); }
    th,td { padding:9px 6px; }
  }
</style></head>
<body><main>
  <p class="selo">Arquivo Homeschooling · Relatório diário</p>
  <h1>Alfabetilar<br>origem das vendas</h1>
  <p class="ts">Últimos 7 dias · atualizado em 04/10/2026 às 20:18</p>
  
  <div class="orn">❦</div>
  <p class="vazio">Nenhuma venda do produto no período.</p>
</main></body></html>
